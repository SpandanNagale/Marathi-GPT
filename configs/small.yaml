# marathi-small — ~50M params. First "real" model, should produce coherent Marathi.
model:
  n_layer: 8
  n_head: 8
  n_embd: 512
  block_size: 1024
  vocab_size: 32000
  dropout: 0.0
  bias: false

train:
  micro_batch_size: 32
  grad_accum_steps: 16       # effective batch = 32 * 1024 * 16 = 524,288 tokens/step
  max_steps: 40000           # placeholder — recompute once corpus size is known (Phase 5)
  warmup_ratio: 0.02
  learning_rate: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 250
  eval_iters: 50
  checkpoint_interval: 1000
  keep_last_n: 3
  compile: true
  dtype: bfloat16

data:
  data_dir: data/bin
